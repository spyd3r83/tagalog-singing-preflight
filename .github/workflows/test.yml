name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m tagalog_singing_preflight audit examples/valid-plan.json
      - run: python -m tagalog_singing_preflight soulx examples/soulx-metadata.json examples/soulx-example-phoneset.json --expected-frames 50
      - run: python -m tagalog_singing_preflight benchmark data/tagalog-benchmark-v1.json
      - run: python -m tagalog_singing_preflight lexicon examples/lexicon-demo.tsv "zaya zana absent" --source-label synthetic-demo --data-license MIT
      - run: python -m tagalog_singing_preflight review-draft data/tagalog-benchmark-v1.json dev-05 examples/lexicon-demo.tsv --source-label synthetic-demo --data-license MIT
      - run: python examples/make_phone_mapping_demo.py mapping-demo
      - run: python -m tagalog_singing_preflight phone-map data/tagalog-benchmark-v1.json dev-05 examples/lexicon-demo.tsv mapping-demo/review.json mapping-demo/mapping.json mapping-demo/vocabulary.json --source-label synthetic-demo --data-license MIT
      - run: python examples/make_listening_demo.py listening-demo
      - run: python -m tagalog_singing_preflight listening data/tagalog-benchmark-v1.json listening-demo/plan.json listening-demo/packet --seed 17
      - run: python examples/make_listening_demo.py listening-demo/synthetic-responses.csv --responses-for listening-demo/packet
      - run: python -m tagalog_singing_preflight responses listening-demo/packet listening-demo/synthetic-responses.csv --listener-id synthetic-demo
