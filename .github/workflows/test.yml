name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m tagalog_singing_preflight audit examples/valid-plan.json
      - run: python -m tagalog_singing_preflight soulx examples/soulx-metadata.json examples/soulx-example-phoneset.json --expected-frames 50
      - run: python -m tagalog_singing_preflight benchmark data/tagalog-benchmark-v1.json
